<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠娜 | 數獨遊戲</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>數獨 Sudoku</h1>
        <p>享受邏輯與數字的樂趣！</p>

        <div class="controls">
            <select id="difficulty">
                <option value="40">簡單</option>
                <option value="30" selected>中等</option>
                <option value="20">困難</option>
            </select>

            <button id="newGame">產生新題目</button>
            <button id="restart">重新開始</button>
        </div>

        <div id="timer">00:00</div>

        <div id="board"></div>

        <div class="numbers" id="numbers"></div>

        <div class="controls">
            <button id="check">檢查答案</button>
            <button id="hint">提示一格</button>
            <button id="solution">顯示答案</button>
        </div>

        <div class="controls">
            <button id="downloadPuzzle">下載題目 JPG</button>
        </div>

        <div id="message">請選擇格子開始遊戲！</div>

    </div>

    <!-- 完成結算視窗 -->

    <div class="modal" id="resultModal">
        <div class="modal-content">

            <h2>🎉 恭喜完成數獨！</h2>

            <p>你成功解開了這道謎題！</p>

            <div class="result-time" id="resultTime">
                00:00
            </div>

            <div class="result-item">
                <span>遊戲難度</span>
                <span id="resultDifficulty"></span>
            </div>

            <div class="result-item">
                <span>使用提示</span>
                <span id="resultHint"></span>
            </div>

            <div class="result-item">
                <span>提示次數</span>
                <span id="resultHintCount"></span>
            </div>

            <div class="result-item">
                <span>完成日期</span>
                <span id="resultDate"></span>
            </div>

            <div class="controls">
                <button id="downloadResult">下載成績紀錄</button>
                <button id="playAgain">再玩一局</button>
            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
